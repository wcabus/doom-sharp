on:
  push:
  
  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.x'

    - uses: actions/setup-java@v4
      with:
        java-version: '21.x'
        distribution: 'microsoft'

    - uses: actions/checkout@v4
    
    - run: |
        dotnet build src/DoomSharp.sln
